openapi: 3.0.0
info:
  title: Calendar API
  description: API сервиса записи на звонок.
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      description: Проверка доступности API.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Состояние сервиса.
servers:
  - url: http://localhost:3001
    description: Local development server
    variables: {}
