[settings]
experimental = true

[tools]
node = "22.23.5"
hk = "2.12.0"
pitchfork = "2.34.0"

[env]
API_PORT = "3001"

# pitchfork waits forever on ready_port when the port is already listening,
# so daemons use pitchfork's default 3s readiness delay instead.
[daemons.api]
run = "exec npm run dev:api"

[daemons.web]
run = "exec npm run dev:web"

[daemon_groups]
default = ["api", "web"]

[tasks.install]
description = "Install project dependencies"
run = "npm install"

[tasks.contract]
description = "Regenerate OpenAPI contract and typed SDK"
run = "npm run contract"

[tasks."contract:check"]
description = "Fail if generated contract or SDK differs from TypeSpec"
run = "npm run contract:check"

[tasks.dev]
description = "Start API and web dev servers as daemons"
daemons = ["api", "web"]
run = "echo 'API: http://localhost:3001  Web: http://localhost:5173'"

[tasks.test]
description = "Run tests once"
run = "npm test"

[tasks.typecheck]
description = "Type-check the whole project"
run = "npm run typecheck"

[tasks.lint]
description = "Run oxlint"
run = "npm run lint"

[tasks.check]
description = "Run lint, typecheck, tests and contract drift (used by CI and hk)"
run = "npm run check"

[tasks.build]
description = "Type-check and build for production"
run = "npm run build"

[tasks.preview]
description = "Preview the production build"
run = "npm run preview"
