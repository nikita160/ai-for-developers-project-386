name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: |
          set -o pipefail
          node -v
          npm -v
          npm config get registry
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log; then
              exit 0
            fi
            echo "npm ci failed (attempt ${attempt}/3)"
            sleep 5
          done
          echo "::error::$(tail -40 /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-800)"
          exit 1

      - name: Check contract drift
        run: mise run contract:check

      - run: mise run check

      - run: npm run build
